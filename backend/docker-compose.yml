version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: civicpulse-postgres
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse123
      POSTGRES_DB: civicpulsedb
    ports:
      - "5432:5432"
    volumes:
      - civicpulse_pgdata:/var/lib/postgresql/data

volumes:
  civicpulse_pgdata:
